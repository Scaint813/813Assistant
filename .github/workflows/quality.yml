name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Conflict markers
        run: bash scripts_check_no_conflicts.sh
      - name: Compile
        run: python -m compileall .
      - name: Mini App JavaScript syntax
        run: |
          node --check bot/miniapp/resource_store.js
          node --check bot/miniapp/app.js
          node tests/test_mini_app_resource_store.js
          node tests/test_mini_app_navigation.js
      - name: Lint
        run: python -m ruff check bot tests
      - name: Tests
        run: python -m unittest discover -s tests -v
