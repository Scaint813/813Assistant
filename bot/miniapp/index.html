<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f5">
  <meta name="color-scheme" content="light dark">
  <title>813Assistant</title>
  <link rel="stylesheet" href="assets/app.css?v=8">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script type="module" src="assets/app.mjs?v=3"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="date-label">Расписание</p>
        <h1 id="page-title">Сегодня</h1>
      </div>
      <div class="topbar-actions">
        <button class="icon-button" id="help-button" type="button" aria-label="Открыть справку">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.8 9.2a2.4 2.4 0 0 1 4.6 1c0 1.8-2.4 2-2.4 3.7"></path><path d="M12 17.2h.01"></path></svg>
        </button>
        <button class="icon-button" id="refresh-button" type="button" aria-label="Обновить данные">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"></path><path d="M18.5 15a7 7 0 1 1-.8-7.8L20 9"></path></svg>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1">
      <section class="status-screen" id="loading-screen" aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        <p>Собираю план дня…</p>
      </section>
      <section class="status-screen hidden" id="error-screen" aria-live="assertive">
        <span class="status-symbol" aria-hidden="true">!</span>
        <h2>Не удалось открыть планнер</h2>
        <p id="error-message">Попробуй открыть его кнопкой «Управление» в чате с ботом.</p>
        <button class="primary-button" id="retry-button" type="button">Повторить</button>
      </section>
      <div id="view" class="hidden"></div>
    </main>

    <div class="offline-banner hidden" id="offline-banner" role="status">Нет сети — показываю последние данные</div>

    <button class="fab" id="add-task-button" type="button" aria-label="Добавить задачу">
      <span aria-hidden="true">+</span>
    </button>

    <nav class="bottom-nav" aria-label="Основное меню">
      <button class="nav-item active" data-view="today" type="button" aria-current="page">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"></path></svg>
        <span>Сегодня</span>
      </button>
      <button class="nav-item" data-view="planner" type="button">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4m8-4v4M4 10h16"></path></svg>
        <span>План</span>
      </button>
      <button class="nav-item" data-view="tasks" type="button">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>
        <span>Задачи</span>
      </button>
      <button class="nav-item" data-view="health" type="button">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 5.8a5.5 5.5 0 0 0-7.8 0L12 6.9l-1.1-1.1a5.5 5.5 0 0 0-7.7 7.8L12 22l8.8-8.4a5.5 5.5 0 0 0 0-7.8z"></path></svg>
        <span>Здоровье</span>
      </button>
      <button class="nav-item" data-view="profile" type="button">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg>
        <span>Профиль</span>
      </button>
    </nav>
  </div>

  <dialog id="task-dialog" class="sheet-dialog">
    <form id="task-form" method="dialog">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-heading">
        <div>
          <p class="eyebrow">Новая запись</p>
          <h2>Добавить задачу</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Закрыть" type="submit">×</button>
      </div>
      <label class="field">
        <span>Что нужно сделать</span>
        <input id="task-title" name="title" type="text" maxlength="255" minlength="2" required
               autocomplete="off" placeholder="Например, отправить документы">
      </label>
      <details class="task-options">
        <summary>Срок и длительность</summary>
        <div class="form-row">
          <label class="field">
            <span>Срок</span>
            <input id="task-deadline" name="deadline" type="datetime-local">
          </label>
          <label class="field field-small">
            <span>Минут</span>
            <input id="task-duration" name="estimated_minutes" type="number" min="5" max="10080" step="5" value="30">
          </label>
        </div>
      </details>
      <button class="primary-button full-width" id="save-task-button" value="default" type="submit">Добавить</button>
    </form>
  </dialog>

  <dialog id="setup-dialog" class="sheet-dialog setup-dialog">
    <div id="setup-content"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
